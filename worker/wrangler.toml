name = "ai-tarot-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Deployed through Cloudflare's Git integration with the project root set to
# /worker, so pushes that only touch /web or /data do not rebuild the relay.
# That separation is the point: packs and prompts iterate without redeploying
# anything that touches a key.

[vars]
# The deployed frontend origin, and only that: "*" would leave the relay open
# for anyone to spend their own key through, which is a bill somebody else pays
# in attention even if not in money. A fork changes this line and the matching
# one in web/js/relayBase.js.
#
# For local dev, copy .dev.vars.example to .dev.vars and put "*" there. Wrangler
# reads .dev.vars only under `wrangler dev`, never on deploy, and vars are NOT
# inherited by named [env.*] blocks -- an [env.dev] would have to restate
# PROVIDERS too, and a second copy of the provider map is a thing to get wrong.
ALLOWED_ORIGINS = "https://wyc79.github.io"

# Requests per IP per minute.
RATE_LIMIT = "30"

# Adding a provider is a config change here, not a code change.
PROVIDERS = '''{"deepseek":{"url":"https://api.deepseek.com/anthropic/v1/messages","auth":"x-api-key"},"opencode":{"url":"https://opencode.ai/zen/v1/messages","auth":"x-api-key"},"anthropic":{"url":"https://api.anthropic.com/v1/messages","auth":"x-api-key","headers":{"anthropic-version":"2023-06-01"}}}'''
